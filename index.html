<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone, paper and scissors game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="heading">
        <h1>Stone, Paper & Scissors Game</h1>
    </div>
    <div class="container">
        <div class="items" id="scissors">
            <img src="scissors.png">
        </div>
        <div class="items" id="paper">
            <img src="paper.png">
        </div>
        <div class="items" id="rock">
            <img src="rock.png">
        </div>
    </div>
    <div class="result">
        <div class="player">
            <p>You</p>
            <p id="you">0</p>
        </div>
        <div class="comp">
            <p>Comp</p>
            <p id="compu">0</p>
        </div>
    </div>
    <div class="message">
        <div class="msg">
            
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
